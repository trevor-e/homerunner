# Copy to config.toml (or pass --config). All [defaults] keys can be overridden
# per [[repos] ] entry.

[supervisor]
dashboard_port = 4123          # dashboard binds 127.0.0.1 only
max_total_runners = 4          # global cap across repos (RAM guard)
data_dir = "~/.local/share/homerunner"

[auth]
source = "gh"                  # `gh auth token` | "env:HOMERUNNER_PAT" | "file:~/.homerunner-pat"

[toolchains]
python = "3.13.1"              # baked into the actions/setup-python tool cache
node = "24.14.0"               # baked into the actions/setup-node tool cache

[defaults]
runtime = "docker"             # "docker" | "apple-container" (requires Apple Silicon)
labels = ["self-hosted", "linux", "x64"]
image = "homerunner-runner:local"
reserved = 1                   # warm listeners always alive (0 = fully on-demand)
max = 2                        # burst ceiling; queued jobs scale the pool up to this
job_timeout_min = 120          # kill + respawn a wedged busy runner
caffeinate = true              # keep the Mac awake while a job is running
# registry_mirror = "http://host.docker.internal:5001"

[[repos]]
repo = "trevor-e/adulting"
reserved = 2
max = 3

[[repos]]
repo = "trevor-e/sidequest"    # low-traffic repo: no idle cost, ~30s pickup latency
reserved = 0
max = 1
