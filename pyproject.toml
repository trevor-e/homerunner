[project]
name = "homerunner"
version = "0.1.0"
description = "Warm pool of ephemeral self-hosted GitHub Actions runners on a Mac"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.10"]

[project.scripts]
homerunner = "homerunner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homerunner"]
